[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steuerpilot-pro"
version = "0.2.0"
description = "Auditable accounting-core prototype for SteuerPilot Pro"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptols]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
