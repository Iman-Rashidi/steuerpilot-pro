name: Python tests

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:

  payroll-wasm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Build the BMF PAP interpreter for browsers
        run: cargo build --manifest-path wasm/Cargo.toml --release --target wasm32-unknown-unknown
      - name: Run BMF 2026 reference tests
        run: cargo test --manifest-path wasm/Cargo.toml --locked
      - name: Generate browser assets
        run: |
          mkdir -p static
          wasm-bindgen --target web --out-dir static --no-typescript wasm/target/wasm32-unknown-unknown/release/steuerpilot_payroll_wasm.wasm
          cp data/bmf/Lohnsteuer2026.xml static/Lohnsteuer2026.xml
      - name: Run the built WebAssembly tax engine in Node
        run: node wasm/test_wasm.mjs
      - name: Commit generated browser assets to the source branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wasm/Cargo.lock static/steuerpilot_payroll_wasm.js static/steuerpilot_payroll_wasm_bg.wasm static/Lohnsteuer2026.xml
          if git diff --cached --quiet; then
            echo "Generated payroll assets are already current."
          else
            git commit -m "Build browser payroll tax engine assets [skip ci]"
            branch="${{ github.head_ref || github.ref_name }}"
            git fetch origin "$branch"
            git rebase "origin/$branch"
            git push origin "HEAD:$branch"
          fi
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Install package
        run: python -m pip install .
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run regression suite against installed package
        run: python -m unittest discover -s tests -v
      - name: Check payroll browser JavaScript syntax
        run: |
          python -c "import re; from pathlib import Path; from payroll_demo import PAYROLL_PAGE; Path('/tmp/payroll.js').write_text(re.search(r'<script>(.*?)</script>', PAYROLL_PAGE, re.S).group(1))"
          node --check /tmp/payroll.js
